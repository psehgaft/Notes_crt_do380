apiVersion: v1
kind: ResourceQuota
metadata:
  name: dev-monitor-compute
  namespace: dev-monitor
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: dev-monitor-defaults
  namespace: dev-monitor
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi

