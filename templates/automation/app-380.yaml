apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-380
  namespace: app-380
  labels:
    app.kubernetes.io/name: app-380
    app.kubernetes.io/part-of: do380-labs
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: app-380
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app-380
    spec:
      containers:
        - name: app-380
          image: registry.access.redhat.com/ubi9/httpd-24:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: app-380
  namespace: app-380
spec:
  selector:
    app.kubernetes.io/name: app-380
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: app-380
  namespace: app-380
spec:
  to:
    kind: Service
    name: app-380
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

